<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 English Curriculum Plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2933;--bg:#f7f7f5;--muted:#4a5562;--navy:#1d2b4f;--soon:#4a5562;
    --sans:"Atkinson Hyperlegible",Arial,Helvetica,sans-serif;--serif:"Source Serif 4",Georgia,serif;
    --t1:#2a5f9e;--t1l:#dce8f6;--t2:#2e7d32;--t2l:#dcefdb;--t3:#a8532a;--t3l:#f6e1d5;--t4:#7e3f84;--t4l:#efdff0;}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg)}

  .banner{background:var(--navy);color:#fff;text-align:center;padding:44px 16px 38px}
  .banner .school{font-size:15px;opacity:.85}
  .banner h1{margin:8px 0 6px;font-family:var(--serif);font-size:clamp(30px,6vw,46px);font-weight:700;line-height:1.1}
  .banner .tag{font-size:16px;opacity:.85}
  .strip{display:grid;grid-template-columns:repeat(4,1fr);height:6px}
  .strip span:nth-child(1){background:var(--t1)}.strip span:nth-child(2){background:var(--t2)}
  .strip span:nth-child(3){background:var(--t3)}.strip span:nth-child(4){background:var(--t4)}

  .cols{max-width:800px;margin:28px auto 0;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .col{background:#fff;border:1px solid #ddd}
  .col h2{margin:0;background:var(--navy);color:#fff;padding:10px 14px;font-family:var(--serif);font-size:20px;font-weight:700;text-align:center}
  .list{display:grid;gap:16px;padding:18px}

  a.plan{display:flex;justify-content:space-between;align-items:center;padding:24px 28px;min-height:84px;border:1px solid var(--c);border-left:8px solid var(--c);border-radius:6px;color:var(--navy);text-decoration:none;font-weight:bold;font-size:20px;background:var(--l);transition:background .2s,color .2s}
  a.plan:hover{background:var(--c);color:#fff}
  a.plan:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
  a.plan small{font-weight:normal;font-size:15px}
  .y7{--c:var(--t1);--l:var(--t1l)} .y8{--c:var(--t2);--l:var(--t2l)} .y9{--c:var(--t3);--l:var(--t3l)} .y10{--c:var(--t4);--l:var(--t4l)}

  .soon{display:flex;justify-content:space-between;align-items:center;padding:24px 28px;min-height:84px;border:1px dashed var(--c);border-left:8px solid var(--l);border-radius:6px;color:var(--soon);font-size:18px;background:#fff}
  .soon small{font-style:italic;font-size:14px}

  .y11,.y12{--c:var(--navy);--l:#e3e7f0}
  .senior{grid-column:1/-1;margin-bottom:28px}
  .senior .list{grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:560px){.cols{grid-template-columns:1fr}.senior .list{grid-template-columns:1fr;gap:16px}}
  @media (prefers-reduced-motion:reduce){a.plan{transition:none}}
</style>
</head>
<body>
<header>
  <div class="banner">
    <div class="school">South Oakleigh College</div>
    <h1>2027 English Curriculum Plans</h1>
    <div class="tag">Years 7 to 12</div>
  </div>
  <div class="strip"><span></span><span></span><span></span><span></span></div>
</header>

<main class="cols">
  <section class="col">
    <h2>Mainstream</h2>
    <div class="list">
      <div class="soon y7"><span>Year 7</span><small>Coming soon</small></div>
      <div class="soon y8"><span>Year 8</span><small>Coming soon</small></div>
      <div class="soon y9"><span>Year 9</span><small>Coming soon</small></div>
      <div class="soon y10"><span>Year 10</span><small>Coming soon</small></div>
    </div>
  </section>

  <section class="col">
    <h2>Advanced</h2>
    <div class="list">
      <div class="soon y7"><span>Year 7</span><small>Coming soon</small></div>
      <div class="soon y8"><span>Year 8</span><small>Coming soon</small></div>
      <a class="plan y9" href="09ADVEN1.html"><span>Year 9</span><small>Open plan</small></a>
      <a class="plan y10" href="10ADVEN1.html"><span>Year 10</span><small>Open plan</small></a>
    </div>
  </section>

  <section class="col senior">
    <div class="list">
      <div class="soon y11"><span>Year 11</span><small>Coming soon</small></div>
      <div class="soon y12"><span>Year 12</span><small>Coming soon</small></div>
    </div>
  </section>
</main>
</body>
</html>
