<style>
  :root{--ink:#1f2933;--line:#9aa5b1;--bg:#f7f7f5;--navy:#1d2b4f;--muted:#4a5562;--ph:#5b6570;

  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:var(--sans);color:var(--ink);background:var(--bg)}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  h1{margin:0;background:var(--navy);color:#fff;padding:8px 18px;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:0;outline-offset:3px}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tools button,.tools a{font:inherit;font-size:14px;min-height:36px;padding:7px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .tools button:hover,.tools a:hover{border-color:var(--navy)}
  #save{background:var(--navy);color:#fff;border-color:var(--navy)}
  #status{font-size:14px;color:var(--muted)}
  .hint{font-size:14px;color:var(--muted);margin:0 0 14px;max-width:80ch}
  .grid{display:grid;grid-template-columns:1fr;gap:20px}
  section{background:#fff;padding:10px;border:1px solid #ddd;border-top:5px solid var(--c);overflow-x:auto}
  h2{text-align:center;margin:4px 0 2px;font-family:var(--serif);font-size:21px;font-weight:700;color:var(--c)}
  .dates{text-align:center;font-size:13px;color:var(--muted);margin-bottom:8px}
  table{border-collapse:collapse;table-layout:fixed;font-size:13px}
  th,td{border:1px solid var(--line);padding:4px;vertical-align:top}
  thead th{font-size:14px}
  thead th small{display:block;font-weight:normal;font-size:12px}
  .hol{display:block;font-size:11px;font-weight:normal}
  .tag{display:block;font-size:12px;font-weight:bold}
  .t1{--c:#2a5f9e;--l:#dce8f6}.t2{--c:#2e7d32;--l:#dcefdb}.t3{--c:#a8532a;--l:#f6e1d5}.t4{--c:#7e3f84;--l:#efdff0}
  .term thead th{background:var(--c);color:#fff}
  .term thead th.grey{background:#5f666d}
  td{background:var(--l)}
  td.grey{background:#e1e3e5;color:#4a5057}
  .wn{min-height:26px;font-size:13px;font-weight:bold;border-bottom:1px solid var(--line);margin-bottom:4px;outline:none;word-wrap:break-word}
  .wn:empty::before{content:"Notes / CAT";color:var(--ph);font-weight:normal}
  .wn.cat{background:var(--navy);color:#fff;border:none;border-radius:3px;padding:5px 7px;margin-bottom:6px;font-size:13px;cursor:pointer}
  .wn.cat:empty::before{content:none}
  .les{margin-top:3px}
  .lh{cursor:pointer;background:rgba(0,0,0,.07);padding:5px 7px;font-weight:bold;border:1px solid var(--line);user-select:none;font-size:13px}
  .lh::before{content:"\25B8  "}
  .les.open .lh::before{content:"\25BE  "}
  .les.filled .lh{background:var(--c);color:#fff}
  td.grey .lh{background:#c3c6c9;color:#363b40}
  .lb{display:none;min-height:50px;padding:4px;border:1px solid var(--line);border-top:none;background:#fff;word-wrap:break-word}
  .les.open .lb{display:block}
  .fl{font-size:11px;font-weight:bold;color:var(--muted);margin:6px 0 1px}
  .fld{min-height:22px;padding:2px 4px;border-bottom:1px dotted var(--line);outline:none;word-wrap:break-word;font-size:13px}
  .fld:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  .fld:focus,.codes:focus{background:#fffbe6}
  .info{display:none;background:#fff;border:1px solid var(--line);border-radius:3px;padding:5px 6px;margin:0 0 6px;font-size:13px;outline:none;word-wrap:break-word}
  .wn.cat.open + .info{display:block}
  .info:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  .ccw{margin:0 0 4px}
  .cch{cursor:pointer;font-size:12px;font-weight:bold;color:#2d3748;background:rgba(0,0,0,.06);border:1px solid var(--line);padding:3px 7px;user-select:none}
  .cch::before{content:"\25B8  "}
  .ccw.open .cch::before{content:"\25BE  "}
  .codes{display:none;font-size:12px;color:#2d3748;padding:3px 4px;border:1px solid var(--line);border-top:none;background:#fff;word-wrap:break-word;outline:none}
  .ccw.open .codes{display:block}
  .codes:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  :focus-visible{outline:2px solid var(--navy);outline-offset:1px}
  .wn:focus,.info:focus{outline:2px solid var(--navy)}
  @media print{
    @page{size:A3 landscape;margin:8mm}
    body{background:#fff;padding:0}
    .tools,.hint{display:none}
    .grid{gap:8px}
    section{break-inside:avoid;border:none;border-top:4px solid var(--c)}
    .lb{display:block!important;min-height:30px}
    .lh::before{content:""}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

let store=Object.assign({},DEFAULTS,SAVED);
let dirty=false, handle=null;
const grid=document.getElementById("grid");
const statusEl=document.getElementById("status");
const fmt=d=>d.toLocaleDateString("en-AU",{day:"numeric",month:"short"});
function setStatus(t){statusEl.textContent=t;}

TERMS.forEach(t=>{
  const s=document.createElement("section");s.className="term t"+t.n;
  let h=`<h2>Term ${t.n}</h2><div class="dates">${t.label} · ${t.weeks} weeks</div>`+
        `<table style="width:${(t.weeks/11*100).toFixed(2)}%;min-width:${t.weeks*120}px"><thead><tr>`;
  for(let w=1;w<=t.weeks;w++){
    const g=t.grey[w];
    const d=new Date(t.start+"T00:00");d.setDate(d.getDate()+7*(w-1));
    h+=`<th${g?' class="grey"':""}>Week ${w}<small>${fmt(d)}</small>`+
       `${t.notes[w]?`<span class="hol">${t.notes[w]}</span>`:""}`+
       `${g?`<span class="tag">${g}</span>`:""}</th>`;
  }
  h+="</tr></thead><tbody><tr>";
  for(let w=1;w<=t.weeks;w++){
    const g=t.grey[w];
    const lessons=(t.noLessons||[]).includes(w)?[]:t.hol.includes(w)?["Lesson I","Lesson II","Lesson III","Ad libitum"]:["Lesson I","Lesson II","Lesson III","Lesson IV"];
    const nn=(t.noLessons||[]).includes(w)&&!(t.exam||[]).includes(w);
    h+=`<td${g&&!(t.exam||[]).includes(w)?' class="grey"':""}>${nn?"":`<div class="wn" contenteditable="true" data-k="${t.n}--${w}"></div><div class="info" contenteditable="true" data-k="info-${t.n}--${w}" data-ph="Assessment details"></div><div class="ccw"><div class="cch" role="button" tabindex="0" aria-expanded="false">Curriculum codes</div><div class="codes" contenteditable="true" data-k="codes-${t.n}--${w}" data-ph="Add curriculum codes"></div></div>`}`;
    lessons.forEach((name,i)=>{
      const k=`${t.n}-${w}-${i+1}`;
      h+=`<div class="les"><div class="lh" role="button" tabindex="0" aria-expanded="false">${store[`${t.n}-${w}-${i+1}-title`]||name}</div><div class="lb">`+
         `<div class="fl">Learning Intention</div><div class="fld" contenteditable="true" data-k="${k}-li" data-ph="What students will learn (student-friendly)"></div>`+
         `<div class="fl">Success Criteria</div><div class="fld" contenteditable="true" data-k="${k}-sc" data-ph="Observable, specific steps to show learning"></div>`+
         `<div class="fl">Do Now</div><div class="fld" contenteditable="true" data-k="${k}-dn" data-ph="Starter task at the start of the lesson"></div>`+
         `</div></div>`;
    });
    h+="</td>";
  }
  h+="</tr></tbody></table>";
  s.innerHTML=h;grid.appendChild(s);
});

document.querySelectorAll("[data-k]").forEach(el=>{
  el.textContent=store[el.dataset.k]||"";
  const mark=()=>{
    if(el.classList.contains("wn"))el.classList.toggle("cat",/^(S[12]_|EXAM)/.test(el.innerText.trim()));
    const les=el.closest(".les");
    if(les&&el.classList.contains("fld"))les.classList.toggle("filled",[...les.querySelectorAll(".fld")].some(f=>f.innerText.trim()));
  };
  mark();
  el.addEventListener("input",()=>{store[el.dataset.k]=el.innerText.trim();dirty=true;setStatus("Unsaved changes");mark();});
});
document.querySelectorAll(".lh,.cch").forEach(b=>{
  b.addEventListener("click",()=>b.setAttribute("aria-expanded",b.parentElement.classList.toggle("open")));
  b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();b.click();}});
});
document.querySelectorAll(".wn").forEach(w=>w.addEventListener("click",()=>{if(w.classList.contains("cat"))w.classList.toggle("open");}));
document.querySelector("h1").addEventListener("input",()=>{dirty=true;setStatus("Unsaved changes");});

// Build the file text: original page with the current entries written into SAVED
function fileText(){
  const c=document.documentElement.cloneNode(true);
  c.querySelector("#grid").innerHTML="";
  c.querySelector("#status").textContent="";
  const data=JSON.stringify(store);
  const html="<!doctype html>\n"+c.outerHTML;
  return html.replace(/const SAVED=.*;\n/, ()=>"const SAVED="+data+";\n");
}
async function save(){
  const text=fileText();
  if(window.showSaveFilePicker){
    try{
      if(!handle)handle=await window.showSaveFilePicker({suggestedName:document.title+".html",
        types:[{description:"HTML file",accept:{"text/html":[".html"]}}]});
      const w=await handle.createWritable();
      await w.write(text);
      await w.close();
      dirty=false;
      setStatus("Saved at "+new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"}));
      return;
    }catch(e){
      if(e.name==="AbortError")return;
      handle=null;
    }
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/html"}));
  a.download=document.title+".html";
  a.click();
  dirty=false;
  setStatus("Downloaded – replace the file in your folder with it");
}
document.getElementById("save").onclick=save;
if(location.hostname.endsWith("github.io")){["save","clear"].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display="none";});}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();save();}});
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});
document.getElementById("clear").onclick=()=>{
  if(!window.confirm("Clear every entry?"))return;
  store={};
  document.querySelectorAll("[data-k]").forEach(el=>{el.textContent="";});
  document.querySelectorAll(".les.filled").forEach(el=>el.classList.remove("filled"));
  dirty=true;setStatus("Unsaved changes – click Save");
};
</script>
